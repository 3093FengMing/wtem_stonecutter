name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve everything but upload nothing'
        type: boolean
        default: true

# Two releases running at once would fight over the same GitHub release, so let an in-flight one
# finish rather than cancelling it half way through uploading.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # `publishGithub` uses the tag's commit as the release commitish.
          fetch-depth: 0

      # Every version node is published from this one job, so both toolchains have to be present.
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      # A tag that disagrees with `mod.version` would publish under the wrong version everywhere,
      # and platform uploads cannot be taken back, so stop before anything is built.
      - name: Check tag matches mod.version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^mod\.version *= *"\(.*\)"/\1/p' stonecutter.properties.toml)"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod.version=$declared"
            exit 1
          fi
          echo "Releasing version $declared"

      - name: Build all versions
        run: ./gradlew buildAll --stacktrace

      # The release notes come from the tag message so they live with the tag rather than in the
      # build script.
      - name: Collect changelog
        id: changelog
        run: |
          {
            echo 'text<<CHANGELOG_EOF'
            if [ "${GITHUB_REF_TYPE}" = tag ]; then
              git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME"
            fi
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          CHANGELOG: ${{ steps.changelog.outputs.text }}
          # An absent token leaves that platform in dry-run mode, so an unconfigured platform is
          # skipped instead of failing the release.
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          ./gradlew publishAll --stacktrace
          ${{ inputs.dry_run && '-Ppublish.dry_run=true' || '' }}

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: wtem-release
          path: build/libs/**/*.jar
          if-no-files-found: error
