name: Text not extracted / 文本未被提取
description: Text that WTEM should have turned into a translation key but left alone / 某处文本本应转换为翻译键，但保持原样
labels: [ enhancement, extraction ]
body:
  - type: markdown
    attributes:
      value: |
        中文或英文均可 / Chinese or English are both fine.

        The README lists what is currently extracted. Text outside that list is not a bug, but it
        is worth asking for.
        README 列出了目前的提取范围。范围之外的文本不算错误，但欢迎提出。

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version / 游戏版本
      placeholder: "1.21.1"
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Where the text lives / 文本所在位置
      options:
        - Block entity in a chunk / 区块中的方块实体
        - Entity / 实体
        - Scoreboard or boss bar / 记分板或 Bossbar
        - Data pack / 数据包
        - Structure NBT / 结构文件
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: The data / 数据
      description: |
        The NBT, the JSON resource, or the command that holds the text. Paste the smallest piece
        that still contains it.
        承载该文本的 NBT、JSON 资源或命令。请贴出仍包含该文本的最小片段。
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes / 补充说明
      description: |
        Anything that makes the field tricky: whether the game accepts a translate component there
        at all, whether it is version specific, and so on.
        任何需要注意的地方：该字段是否接受翻译组件、是否与版本相关等。
